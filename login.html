<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — FinanceFlow</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23000A64%22/><text x=%2250%22 y=%2270%22 font-size=%2260%22 font-family=%22sans-serif%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22white%22>F</text></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a class="brand" href="index.html" style="padding:0 0 4px">
        <span class="brand-mark">F</span>
        <span class="brand-name">Finance<span>Flow</span></span>
      </a>
      <p class="muted" style="font-size:13.5px">Entre para proteger seus dados e sincronizar entre dispositivos.</p>

      <div class="auth-tabs">
        <button class="active" data-tab="login">Entrar</button>
        <button data-tab="register">Criar conta</button>
        <button data-tab="recover">Recuperar</button>
      </div>

      <!-- LOGIN -->
      <form class="auth-form" id="formLogin">
        <div class="field"><label>E-mail</label>
          <input type="email" id="loginEmail" placeholder="voce@email.com" autocomplete="email" required></div>
        <div class="field"><label>Senha</label>
          <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" required></div>
        <button class="btn btn-primary" type="submit" style="width:100%">Entrar →</button>
        <div class="auth-divider">ou</div>
        <button class="btn btn-google" type="button" id="btnGoogle">
          <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15A11 11 0 0 0 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Entrar com Google
        </button>
      </form>

      <!-- CADASTRO -->
      <form class="auth-form" id="formRegister" style="display:none">
        <div class="field"><label>Nome</label>
          <input id="regNome" placeholder="Seu nome" autocomplete="name" required></div>
        <div class="field"><label>E-mail</label>
          <input type="email" id="regEmail" placeholder="voce@email.com" autocomplete="email" required></div>
        <div class="field"><label>Senha (mín. 6 caracteres)</label>
          <input type="password" id="regPass" placeholder="••••••••" autocomplete="new-password" required></div>
        <button class="btn btn-primary" type="submit" style="width:100%">Criar minha conta 🚀</button>
        <div id="recoveryBox"></div>
      </form>

      <!-- RECUPERAÇÃO -->
      <form class="auth-form" id="formRecover" style="display:none">
        <div class="field"><label>E-mail da conta</label>
          <input type="email" id="recEmail" placeholder="voce@email.com" required></div>
        <div id="recLocalFields">
          <div class="field"><label>Código de recuperação</label>
            <input id="recCode" placeholder="ABC123DEF456"></div>
          <div class="field"><label>Nova senha</label>
            <input type="password" id="recPass" placeholder="••••••••" autocomplete="new-password"></div>
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%">Recuperar acesso</button>
      </form>

      <p class="muted small" style="text-align:center;margin-top:18px" id="authModeHint"></p>
      <p class="small" style="text-align:center;margin-top:8px">
        <a href="dashboard.html" style="color:var(--primary-500);text-decoration:none">Continuar como visitante →</a>
      </p>
    </div>
  </div>

  <script src="assets/js/core/utils.js"></script>
  <script src="assets/js/core/store.js"></script>
  <script src="assets/js/core/gamification.js"></script>
  <script src="assets/js/core/ui.js"></script>
  <script src="assets/js/core/auth.js"></script>
  <script src="assets/js/core/sync.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
