<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estatísticas — FinanceFlow</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23000A64%22/><text x=%2250%22 y=%2270%22 font-size=%2260%22 font-family=%22sans-serif%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22white%22>F</text></svg>">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#000A64">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/vendor/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <aside id="sidebar"></aside>
    <main class="main">
      <header id="topbar"></header>

      <section class="kpi-grid" id="kpis"></section>

      <section class="card section-gap">
        <div class="card-title">
          Heatmap Financeiro <span class="hint">intensidade de gastos por dia</span>
          <span style="display:flex;gap:8px;align-items:center">
            <button class="row-btn" id="hmPrev" title="6 meses atrás">←</button>
            <span class="muted small" id="hmRange"></span>
            <button class="row-btn" id="hmNext" title="6 meses à frente">→</button>
          </span>
        </div>
        <div style="overflow-x:auto;padding-bottom:6px">
          <div class="heatmap-grid" id="heatmap"></div>
        </div>
        <div class="hm-legend">
          sem gastos <i style="background:var(--secondary-soft)"></i>
          <i style="background:#86EFAC"></i>
          <i style="background:#FDE047"></i>
          <i style="background:#FDBA74"></i>
          <i style="background:#F87171"></i> gasto muito alto
        </div>
      </section>

      <section class="grid grid-2 section-gap">
        <div class="card">
          <div class="card-title">Linha Temporal Financeira</div>
          <div class="chart-box"><canvas id="timelineChart"></canvas></div>
        </div>
        <div class="card">
          <div class="card-title">Evolução Patrimonial</div>
          <div class="chart-box"><canvas id="patrChart"></canvas></div>
        </div>
      </section>

      <section class="grid grid-2 section-gap">
        <div class="card">
          <div class="card-title">Gastos por Categoria</div>
          <div class="chart-box"><canvas id="catBar"></canvas></div>
        </div>
        <div class="card">
          <div class="card-title">Radar de Gastos</div>
          <div class="chart-box"><canvas id="catRadar"></canvas></div>
        </div>
      </section>

      <section class="card">
        <div class="card-title">Comparativo Mensal por Categoria <span class="hint">mês atual vs anterior</span></div>
        <div class="chart-box"><canvas id="compChart"></canvas></div>
      </section>
    </main>
  </div>
  <script src="../assets/js/core/utils.js"></script>
  <script src="../assets/js/core/icons.js"></script>
  <script src="../assets/js/core/store.js"></script>
  <script src="../assets/js/core/gamification.js"></script>
  <script src="../assets/js/core/ui.js"></script>
  <script src="../assets/js/core/auth.js"></script>
  <script src="../assets/js/core/sync.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/estatisticas.js"></script>
</body>
</html>
