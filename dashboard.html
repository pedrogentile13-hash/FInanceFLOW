<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — FinanceFlow</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23000A64%22/><text x=%2250%22 y=%2270%22 font-size=%2260%22 font-family=%22sans-serif%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22white%22>F</text></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/vendor/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <aside id="sidebar"></aside>
    <main class="main">
      <header id="topbar"></header>

      <section class="kpi-grid" id="kpis"></section>

      <section class="grid grid-2 section-gap">
        <div class="card">
          <div class="card-title">Entradas × Saídas <span class="hint">últimos 6 meses</span></div>
          <div class="chart-box"><canvas id="flowChart"></canvas></div>
        </div>
        <div class="card">
          <div class="card-title">Evolução Patrimonial <span class="hint">acumulado</span></div>
          <div class="chart-box"><canvas id="patrChart"></canvas></div>
        </div>
      </section>

      <section class="grid grid-2 section-gap">
        <div class="card">
          <div class="card-title">Gastos por Categoria</div>
          <div class="chart-box"><canvas id="catChart"></canvas></div>
        </div>
        <div class="card">
          <div class="card-title">Receita por Projeto</div>
          <div class="chart-box"><canvas id="projChart"></canvas></div>
        </div>
      </section>

      <section class="grid grid-main section-gap">
        <div class="card">
          <div class="card-title">Resumo Inteligente <span class="hint">gerado pela IA</span></div>
          <div id="smartSummary"></div>
        </div>
        <div class="grid" style="gap:18px">
          <div class="card">
            <div class="card-title">Últimos Lançamentos</div>
            <div id="lastTx"></div>
          </div>
        </div>
      </section>

      <section class="grid grid-2">
        <div class="card">
          <div class="card-title">Próximas Metas <span class="hint"><a href="metas.html" style="color:var(--primary-500);text-decoration:none">ver todas →</a></span></div>
          <div id="nextMetas"></div>
        </div>
        <div class="card">
          <div class="card-title">Conquistas Recentes <span class="hint"><a href="conquistas.html" style="color:var(--primary-500);text-decoration:none">ver todas →</a></span></div>
          <div id="recentAchs"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
